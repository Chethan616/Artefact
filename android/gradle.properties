org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Rust library's ABIs: arm64-v8a for phones, x86_64 for the emulator. Build one to save time,
# e.g. `./gradlew installRelease -Partefact.abis=arm64-v8a`.
artefact.abis=arm64-v8a,x86_64

# The app's version and its version code (before the ABI digit: see app/build.gradle.kts, the build
# checks the two agree). Set both to the release's before tagging it: the release workflow refuses a
# tag that differs, and F-Droid's update check reads them from here.
artefact.version=3.0.0-beta.11
artefact.versionCode=3000011

# The certificate every published release has been signed with (CN=ClearPDF Upload; SHA-256 of
# the certificate, as `apksigner verify --print-certs` prints it). Android installs an update only
# from the same key, so a release signed with any other can never update the app people have: a
# tag build fails on a mismatch (app/build.gradle.kts, and the release workflow checks each APK),
# a local release build warns. Change it only if the app's key is ever rotated.
artefact.releaseCertSha256=92fa506003c3e83b933cea5dec33cdae9d4f4beb27bcadf48a15fd0e487401e9
